services:
  - type: web
    name: webforge-api
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MANDAPI_API_KEY
        sync: false
      - key: MANDAPI_MODEL
        sync: false
      - key: MANDAPI_TIMEOUT_MS
        value: 180000
      - key: MANDAPI_MAX_TOKENS
        value: 8500
      - key: CLIENT_ORIGIN
        sync: false
      - key: POSEIDON_PUBLIC_KEY
        sync: false
      - key: POSEIDON_SECRET_KEY
        sync: false
      - key: POSEIDON_WEBHOOK_SECRET
        sync: false
      - key: POSEIDON_WEBHOOK_URL
        sync: false
